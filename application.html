<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO Milano — Применение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0f0f0d;
    --off-white: #f7f5f0;
    --light-gray: #e8e5df;
    --accent: #b8894a;
    --accent-light: #f0e8d8;
    --text: #1a1916;
    --text-secondary: #6b6860;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--off-white);
    color: var(--text);
    overflow-x: hidden;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 6vw;
    transition: background 0.4s ease;
  }
  nav.scrolled {
    background: rgba(15,15,13,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .nav-back {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    opacity: 0.5;
    transition: opacity 0.3s ease;
  }
  .nav-back:hover { opacity: 1; }
  .nav-back span {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(247,245,240,0.8);
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--off-white);
  }
  .nav-tag {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(247,245,240,0.4);
  }
  .hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 6vw 8vh;
    position: relative;
    overflow: hidden;
    background: var(--black);
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 70% 30%, rgba(184,137,74,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 20% 80%, rgba(184,137,74,0.06) 0%, transparent 50%);
  }
  .hero-label {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.8s ease 0.3s forwards;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(72px, 14vw, 160px);
    font-weight: 300;
    line-height: 0.92;
    color: var(--off-white);
    letter-spacing: -0.02em;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s ease 0.5s forwards;
  }
  .wip {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 6vw;
    text-align: center;
    gap: 32px;
  }
  .wip-icon {
    opacity: 0.25;
  }
  .wip-label {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .wip-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .wip-text {
    font-size: 15px;
    font-weight: 300;
    line-height: 1.75;
    color: var(--text-secondary);
    max-width: 440px;
  }
  .wip-back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(184,137,74,0.3);
    padding: 12px 24px;
    margin-top: 8px;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .wip-back:hover {
    background: var(--accent-light);
    border-color: var(--accent);
  }
  footer {
    padding: 32px 6vw;
    border-top: 1px solid var(--light-gray);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .footer-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
  }
  .footer-meta {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
    opacity: 0.5;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 540px) {
    nav { padding: 16px 5vw; }
    .wip { padding: 80px 5vw; }
    footer { padding: 24px 5vw; }
  }
</style>
</head>
<body>

<nav id="nav">
  <a class="nav-back" href="index.html">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><polyline points="10,2 4,8 10,14" stroke="#f7f5f0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Все фазы</span>
  </a>
  <div class="nav-logo">S&middot;O</div>
  <div class="nav-tag">Применение NAVTAGmiddot; Фаза 03</div>
</nav>

<section class="wip">
  <div class="wip-icon">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="46" height="46" rx="2" stroke="#b8894a" stroke-width="1.5"/>
      <line x1="14" y1="24" x2="34" y2="24" stroke="#b8894a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="24" y1="14" x2="24" y2="34" stroke="#b8894a" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="wip-label">Применение &mdash; В разработке</div>
  <div class="wip-title">Этот раздел<br>готовится</div>
  <p class="wip-text">Меню, соцсети, сайт, шаблоны и базовые носители — всё разрабатывается на основе утверждённой айдентики.</p>
  <a class="wip-back" href="index.html">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="8,1 3,6 8,11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Вернуться к бренд-системе
  </a>
</section>

<footer>
  <div class="footer-logo">S&middot;O Milano</div>
  <div class="footer-meta">Применение &middot; 2026</div>
</footer>

<script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  }, { passive: true });
</script>
</body>
</html>
